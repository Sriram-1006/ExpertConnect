spring.application.name=expertconnect

# MySQL connection - values come from environment variables so no password
# is ever stored in source code. Set them before running, e.g. PowerShell:
#   $env:EXPERTCONNECT_DB_PASSWORD = "your_mysql_password"
spring.datasource.url=${EXPERTCONNECT_DB_URL:jdbc:mysql://localhost:3306/expertconnect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${EXPERTCONNECT_DB_USERNAME:root}
spring.datasource.password=${EXPERTCONNECT_DB_PASSWORD:}

# Create/update tables automatically - simple and fine for a college project
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# ---------------------------------------------------------------------------
# JWT (Part 4)
# The secret is read from the EXPERTCONNECT_JWT_SECRET environment variable.
# The fallback below is a development-only value - always override it in real
# deployments. It must be at least 32 bytes for HS256.
# ---------------------------------------------------------------------------
expertconnect.jwt.secret=${EXPERTCONNECT_JWT_SECRET:dev-only-insecure-jwt-secret-change-me-please-32bytes}
expertconnect.jwt.expiration-ms=${EXPERTCONNECT_JWT_EXPIRATION_MS:86400000}

# ---------------------------------------------------------------------------
# Bootstrap ADMIN account (Part 4). Created on startup when it does not exist.
# Override EXPERTCONNECT_ADMIN_PASSWORD in any real deployment.
# ---------------------------------------------------------------------------
expertconnect.admin.email=${EXPERTCONNECT_ADMIN_EMAIL:admin@expertconnect.local}
expertconnect.admin.password=${EXPERTCONNECT_ADMIN_PASSWORD:admin12345}
