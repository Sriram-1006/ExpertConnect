spring.application.name=expertconnect

# MySQL connection - values come from environment variables so no password
# is ever stored in source code. Set them before running, e.g. PowerShell:
#   $env:EXPERTCONNECT_DB_PASSWORD = "your_mysql_password"
spring.datasource.url=${EXPERTCONNECT_DB_URL:jdbc:mysql://localhost:3306/expertconnect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${EXPERTCONNECT_DB_USERNAME:root}
spring.datasource.password=${EXPERTCONNECT_DB_PASSWORD:}

# Create/update tables automatically - simple and fine for a college project
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
